<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc"><title id="title">Sitemap and visual system</title><desc id="desc">Four linked pages: Home, Portfolio, Résumé, Contact. Résumé links to the downloadable PDF. The colour palette is navy, cyan, pale blue and off-white.</desc><rect width="900" height="650" fill="#daf1fd"/><text x="58" y="70" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#062d46">A CLEAR PATH THROUGH THE WORK.</text><text x="58" y="103" font-family="Arial,sans-serif" font-size="15" fill="#465f6f">Portfolio structure + visual system</text><rect x="328" y="146" width="244" height="66" fill="#062d46"/><text x="450" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="white">SHARED NAVIGATION</text><path d="M450 212V246M150 275V246H750V275M350 246V275M550 246V275" fill="none" stroke="#062d46" stroke-width="3"/><g fill="white" stroke="#062d46" stroke-width="2"><rect x="60" y="275" width="180" height="90"/><rect x="260" y="275" width="180" height="90"/><rect x="460" y="275" width="180" height="90"/><rect x="660" y="275" width="180" height="90"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#062d46"><g font-size="21" font-weight="bold"><text x="150" y="313">HOME</text><text x="350" y="313">PORTFOLIO</text><text x="550" y="313">RÉSUMÉ</text><text x="750" y="313">CONTACT</text></g><g font-size="12"><text x="150" y="340">Introduction + about</text><text x="350" y="340">Work + image previews</text><text x="550" y="340">Education + skills</text><text x="750" y="340">Email + phone + LinkedIn</text></g></g><path d="M550 365V395" stroke="#062d46" stroke-width="3"/><rect x="460" y="395" width="180" height="52" fill="#56c4f9"/><text x="550" y="427" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#062d46">DOWNLOADABLE PDF</text><path d="M58 486H842" stroke="#9dbbc